<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="Day_5 t2.css">
</head>
<body>
    <h1>Photo Gallery</h1>
   <div class="gallery">
    <!-- Row 1 -->
    <div class="item big"> <!-- Rendu column, Rendu row edukkum -->
        <img src="https://picsum.photos/800/800?random=1" alt="1">
        <div class="overlay">Image 1</div>
    </div>
    <div class="item normal">
        <img src="https://picsum.photos/500/500?random=2" alt="2">
        <div class="overlay">Image 2</div>
    </div>
    <div class="item normal">
        <img src="https://picsum.photos/500/500?random=3" alt="3">
        <div class="overlay">Image 3</div>
    </div>

    <!-- Row 2 -->
    <div class="item wide"> <!-- Rendu column space edukkum -->
        <img src="https://picsum.photos/500/500?random=4" alt="4">
        <div class="overlay">Image 4</div>
    </div>
    <div class="item normal">
        <img src="https://picsum.photos/500/500?random=5" alt="5">
        <div class="overlay">Image 5</div>
    </div>

    <!-- Row 3 -->
    <div class="item tall"> <!-- Rendu row height edukkum -->
        <img src="https://picsum.photos/500/500?random=6" alt="6">
        <div class="overlay">Image 6</div>
    </div>
    <div class="item normal">
        <img src="https://picsum.photos/500/500?random=7" alt="7">
        <div class="overlay">Image 7</div>
    </div>
    <div class="item wide">
        <img src="https://picsum.photos/500/500?random=8" alt="8">
        <div class="overlay">Image 8</div>
    </div>

    <!-- Remaining -->
    <div class="item normal"><img src="https://picsum.photos/500/500?random=9" alt="9"><div class="overlay">Image 9</div></div>
    <div class="item big"><img src="https://picsum.photos/500/500?random=10" alt="10"><div class="overlay">Image 10</div></div>
    <div class="item normal"><img src="https://picsum.photos/500/500?random=11" alt="11"><div class="overlay">Image 11</div></div>
    <div class="item normal"><img src="https://picsum.photos/500/500?random=12" alt="12"><div class="overlay">Image 12</div></div>
</div>
</body>
</html>
