<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Photo Gallery</title>
  <link rel="stylesheet" href="Day_5 t2.css">
</head>
<body>

  <main>
    <h1>Beautiful Flower Gallery</h1>
    
    <div class="gallery">
      
      <figure class="gallery-item item-featured">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80" alt="Yellow flower in bloom">
        <figcaption>Golden Bloom</figcaption>
      </figure>

    
      <figure class="gallery-item">
        <img src="https://images.pexels.com/photos/2058498/pexels-photo-2058498.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Pink rose close up">
        <figcaption>Soft Rose</figcaption>>
        <figcaption>Soft Rose</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.pexels.com/photos/1166209/pexels-photo-1166209.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Purple lavender field">
        <figcaption>Lavender Dreams</figcaption>
      </figure>

      
      <figure class="gallery-item item-wide">
        <img src="https://images.unsplash.com/photo-1471922694854-ff1b63b20054?auto=format&fit=crop&w=800&q=80" alt="Sunflowers field">
        <figcaption>Summer Sunflowers</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?auto=format&fit=crop&w=400&q=80" alt="White daisy flower">
        <figcaption>Pure Daisy</figcaption>
      </figure>

    
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1526344966-89049886b28d?auto=format&fit=crop&w=400&q=80" alt="Red tulips">
        <figcaption>Red Tulips</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=400&q=80" alt="Wildflowers">
        <figcaption>Wild Beauty</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" alt="Lily flower">
        <figcaption>Elegant Lily</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1496062031456-07b8f162a322?auto=format&fit=crop&w=400&q=80" alt="Spring cherry blossom">
        <figcaption>Cherry Blossom</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1507290439931-a861b5a38200?auto=format&fit=crop&w=400&q=80" alt="Blue hydrangeas">
        <figcaption>Blue Hydrangea</figcaption>
      </figure>

      
      <figure class="gallery-item">
        <img src="https://images.pexels.com/photos/461428/pexels-photo-461428.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Orchid">
        <figcaption>Exotic Orchid</figcaption>
      </figure>

    
      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1554631221-f9603e6808be?auto=format&fit=crop&w=400&q=80" alt="Cactus flower">
        <figcaption>Desert Flower</figcaption>
      </figure>
    </div>
  </main>

</body>
</html>
